name: Deploy

# Deploys the opentunnel Worker (cloudflare.config.ts: the relay API and the website) in production mode,
# as opentunnel-production on opentunnel.xyz, whenever it changes on master. Uses the anomalyco org secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Worker secrets persist across deploys and are not set here.

on:
  push:
    branches: [master]
    paths:
      - "cloudflare.config.ts"
      - "vite.config.ts"
      - "index.html"
      - "packages/server/**"
      - "packages/website/**"
      - "packages/protocol/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy opentunnel.xyz
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6

      # cf loads cloudflare.config.ts with Node, not Bun.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run ready

      - run: bun run deploy --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
