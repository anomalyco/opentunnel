name: Publish

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          script: bun run version
          pr-title: Release packages
          commit-message: Release packages

  binaries:
    name: Build ${{ matrix.platform }}
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - run: |
          cargo build --release --locked -p opentunnel-cli --target ${{ matrix.target }}
          mkdir -p out/bin && cp target/${{ matrix.target }}/release/opentunnel out/bin/
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  publish:
    name: Publish packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUR_KEY: ${{ secrets.AUR_KEY }}
      APP_SECRET: ${{ secrets.OPENCODE_APP_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - uses: dtolnay/rust-toolchain@stable
      # crates.io trusted publishing: a short-lived token for this run's cargo publish.
      - id: crates
        uses: rust-lang/crates-io-auth-action@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ready
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
      - run: mv artifacts packages/cli/dist
      - name: Set up AUR SSH key
        if: env.AUR_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/id_aur\n  User aur\n' >> ~/.ssh/config
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "opentunnel"
          git config --global user.email "opentunnel@anoma.ly"
      # The opencode GitHub App can push to anomalyco/homebrew-tap.
      - name: Create Homebrew tap token
        id: tap
        if: env.APP_SECRET != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENCODE_APP_ID }}
          private-key: ${{ secrets.OPENCODE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
      - uses: changesets/action/publish@v2
        with:
          script: bun run release
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
