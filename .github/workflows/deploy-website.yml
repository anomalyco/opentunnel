name: Deploy website

# Deploys packages/website to the opentunnel-website Worker (opentunnel.xyz) whenever the site changes on
# master. Needs two repository secrets from the Cloudflare account that owns the opentunnel.xyz zone:
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts: Edit and Workers Routes: Edit (zone: opentunnel.xyz)
#   CLOUDFLARE_ACCOUNT_ID  that account's ID
# Until they are set, the job runs and skips.

on:
  push:
    branches: [master]
    paths:
      - "packages/website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy opentunnel.xyz
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.CONFIGURED != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."

      - if: env.CONFIGURED == 'true'
        uses: actions/checkout@v6

      - if: env.CONFIGURED == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - if: env.CONFIGURED == 'true'
        run: bun install --frozen-lockfile

      - if: env.CONFIGURED == 'true'
        run: bun run build
        working-directory: packages/website

      - if: env.CONFIGURED == 'true'
        run: bunx wrangler deploy
        working-directory: packages/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
