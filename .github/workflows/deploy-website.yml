name: Deploy website

# Deploys packages/website in production mode (the opentunnel-website-production Worker, opentunnel.xyz)
# whenever the site changes on master. Uses the anomalyco org secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [master]
    paths:
      - "packages/website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy opentunnel.xyz
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6

      # cf loads cloudflare.config.ts with Node, not Bun.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run build
        working-directory: packages/website

      - run: bunx cf deploy --prebuilt --mode production
        working-directory: packages/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
