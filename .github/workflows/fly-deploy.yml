name: Deploy to Fly

# Deploys crates/opentunnel-server and the website (Dockerfile, fly.toml) to the `opentunnel` Fly app on every
# push to master that changes them, rolling one machine at a time. Uses the FLY_API_TOKEN repository secret
# (`fly tokens create deploy -a opentunnel`). Runtime secrets persist on the app and are not set here.

on:
  push:
    branches: [master]
    paths:
      - "crates/opentunnel/**"
      - "crates/opentunnel-server/**"
      - "packages/website/**"
      - "index.html"
      - "vite.config.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy opentunnel on Fly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
