[package]
name = "opentunnel-server"
# The hosted service is deployed, never published, so it keeps its own version outside the release group.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The hosted OpenTunnel service: SNI routing, bridges, the HTTP API, and certificates"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
opentunnel = { path = "../opentunnel" }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-root-certs = "1.0.9"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
tempfile = "3.23.0"
